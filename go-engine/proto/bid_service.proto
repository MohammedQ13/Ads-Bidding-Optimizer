syntax = "proto3";

package bidding;

// This is a copy of cpp-bidder/proto/bid_service.proto (the canonical contract).
// It has the same messages so the Go engine and the C++ servers speak the same
// gRPC. The only extra line is go_package, which the C++ side ignores.
option go_package = "rtbengine/gen/bidding;bidding";

// The DSP bidding service. The Go auction engine calls GetBid for every auction,
// and tells the DSP whether it won through NotifyOutcome. Check is a health probe.
service BidService {
  rpc GetBid(BidRequest) returns (BidResponse);
  rpc NotifyOutcome(AuctionOutcome) returns (Ack);
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

message BidRequest {
  string request_id = 1;
  int32  region = 2;
  int32  city = 3;
  string domain = 4;
  int32  ad_exchange = 5;
  int32  slot_width = 6;
  int32  slot_height = 7;
  int32  slot_visibility = 8;
  int32  slot_format = 9;
  string advertiser_id = 10;
  repeated string user_tags = 11;
  float  slot_floor_price = 12;
  float  impression_value = 13;   // V, set by the Go engine per auction
  int64  timestamp = 14;
}

message BidResponse {
  string dsp_id = 1;
  float  bid_price = 2;
  float  win_probability = 3;
  float  expected_profit = 4;
  bool   used_fallback = 5;
  int64  inference_us = 6;
}

message AuctionOutcome {
  string request_id = 1;
  bool   won = 2;
  float  clearing_price = 3;      // the winning bid amount
  float  your_bid = 4;
  float  profit = 5;              // (V - bid) if won, 0 if lost
}

message Ack {
  bool ok = 1;
}

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
}
