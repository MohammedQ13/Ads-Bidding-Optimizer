# Company C: conservative. Bids 20% below the profit-maximizing bid, so it wins
# fewer auctions but keeps a fatter margin on the ones it does win.
grpc_address: "0.0.0.0:50051"
metrics_port: 9100
model_path: "models/bid_model.onnx"
feature_config_path: "models/feature_config.json"
dsp_id: "company-c"
strategy_type: "conservative"
bid_multiplier: 0.8
batch_workers: 2
batch_max_size: 32
batch_timeout_us: 1000
queue_max_size: 4096
breaker_failure_threshold: 5
breaker_cooldown_ms: 5000
dedup_cache_size: 10000
dedup_cache_ttl_ms: 500
fallback_bid: 80.0
fallback_shading: 0.7
watch_model: false
watch_interval_ms: 2000
