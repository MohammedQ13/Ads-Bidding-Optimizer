# Default config: Company A, the profit maximizer. The same binary becomes any
# other company by pointing it at a different config file (see company_*.yaml).

grpc_address: "0.0.0.0:50051"
metrics_port: 9100

model_path: "models/bid_model.onnx"
feature_config_path: "models/feature_config.json"

dsp_id: "company-a"
strategy_type: "profit_max"
bid_multiplier: 1.0

# micro-batcher and bounded work queue
batch_workers: 2
batch_max_size: 32
batch_timeout_us: 1000
queue_max_size: 4096

# circuit breaker
breaker_failure_threshold: 5
breaker_cooldown_ms: 5000

# dedup cache
dedup_cache_size: 10000
dedup_cache_ttl_ms: 500

# fallback bid (model-free, used when degraded)
fallback_bid: 80.0
fallback_shading: 0.7

# hot-reload: off by default, Phase 3 turns this on for the retraining loop
watch_model: false
watch_interval_ms: 2000
