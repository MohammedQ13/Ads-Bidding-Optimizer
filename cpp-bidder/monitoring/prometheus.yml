# Scrapes the metrics endpoint of every DSP company. Inside the compose network
# each service is reachable by name on its internal metrics port 9100.
global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: "dsp-companies"
    static_configs:
      - targets:
          - "company-a:9100"
          - "company-b:9100"
          - "company-c:9100"
          - "company-d:9100"

  # the auction engine's own metrics (auction-level scoreboard). Only present
  # when running the full system (root docker-compose.yml).
  - job_name: "auction-engine"
    static_configs:
      - targets:
          - "engine:9200"
